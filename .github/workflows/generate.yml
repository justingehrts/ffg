name: Generate Custom FFG KMZ

on:
  schedule:
    - cron: '15 * * * *'  # Runs automatically every hour at :15
  workflow_dispatch:      # Allows manual trigger button in GitHub UI

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies (eccodes)
        run: |
          sudo apt-get update
          sudo apt-get install -y libeccodes-dev

      - name: Install Python Packages
        run: |
          pip install xarray cfgrib numpy matplotlib

      - name: Generate Custom KMZ
        run: python generate_ffg.py

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
          destination_dir: ./
          keep_files: false
          exclude_assets: '.github,generate_ffg.py'
